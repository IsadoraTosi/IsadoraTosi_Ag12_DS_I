<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da aba -->
    <title>Meus sites favoritos</title>

    <!-- Estilização da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .site {
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .site img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .site h2 {
            color: #333;
            font-size: 20px;
        }

        .site a {
            color: #555;
            text-decoration: none;
        }

        .site a:hover {
            color: #0077cc;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal -->
    <h1>Meus sites favoritos: Isadora Tosi</h1>

    <!-- Área dos cinco sites -->
    <div class="container">

        <!-- Canva -->
        <div class="site">
            <h2>Canva</h2>
            <img src="./imagens/canva.jpeg" alt="Logo do Canva">
            <p><a href="https://www.canva.com/" target="_blank">Acessar site</a></p>
        </div>

        <!-- Spotify -->
        <div class="site">
            <h2>Spotify</h2>
            <img src="./imagens/spotify.jpeg" alt="Logo do Spotify">
            <p><a href="https://www.spotify.com/br/" target="_blank">Acessar site</a></p>
        </div>

        <!-- YouTube -->
        <div class="site">
            <h2>YouTube</h2>
            <img src="./imagens/youtube.jpeg" alt="Logo do YouTube">
            <p><a href="https://www.youtube.com/" target="_blank">Acessar site</a></p>
        </div>

        <!-- Instagram -->
        <div class="site">
            <h2>Instagram</h2>
            <img src="./imagens/instagram.jpeg" alt="Logo do Instagram">
            <p><a href="https://www.instagram.com/" target="_blank">Acessar site</a></p>
        </div>

        <!-- Pinterest -->
        <div class="site">
            <h2>Pinterest</h2>
            <img src="./imagens/pinterest.jpeg" alt="Logo do Pinterest">
            <p><a href="https://br.pinterest.com/" target="_blank">Acessar site</a></p>
        </div>

    </div>

</body>
</html>
